name: Napi sajtószemle B - kutatás és PDF

on:
  schedule:
    - cron: '17 2,9,15,21 * * *'
      timezone: 'Europe/Budapest'
    - cron: '37 5 * * *'
      timezone: 'Europe/Budapest'
    - cron: '46 6 * * *'
      timezone: 'Europe/Budapest'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Művelet: collect / publish / smoke'
        required: true
        type: choice
        options:
          - collect
          - publish
          - smoke
        default: smoke

permissions:
  contents: read

concurrency:
  group: daily-press-review-pipeline
  cancel-in-progress: false

jobs:
  press_review:
    name: Forráskutatás, szerkesztés, ellenőrzés
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore persistent state (best effort)
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: review-state-${{ github.run_id }}
          restore-keys: |
            review-state-
      - name: Resolve phase
        id: phase
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_PHASE: ${{ inputs.phase }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "value=${DISPATCH_PHASE:-smoke}" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = '46 6 * * *' ]; then
            echo 'value=publish' >> "$GITHUB_OUTPUT"
          else
            echo 'value=collect' >> "$GITHUB_OUTPUT"
          fi
      - name: Run press review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python -m pressbot.cli --phase '${{ steps.phase.outputs.value }}'
      - name: Save state for future runs (cache is best effort)
        if: always() && steps.phase.outputs.value != 'smoke'
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: review-state-${{ github.run_id }}
      - name: Upload audit reports and generated PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: szemle-${{ github.run_number }}-${{ steps.phase.outputs.value }}
          path: output/
          if-no-files-found: warn
          retention-days: 30